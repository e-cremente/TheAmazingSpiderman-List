:root[data-theme="dark"]{

  --done:#eceef3; --done-fg:#111318;
  --spec:#5fd0c2; --spec-soft:#15302d; --mtu:#e0b25a; --mtu-soft:#33290f; --web:#b49cf2; --web-soft:#2a2140;

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.top{display:flex;justify-content:flex-end;margin-bottom:10px}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:.95;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
header h1 span{color:var(--red)}
.lede{color:var(--muted);max-width:62ch;margin:12px 0 0}
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;margin-top:18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{flex:1 1 220px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:0}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.count{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.next{font-size:14px;flex-basis:100%}
.go{font:inherit;font-weight:600;color:var(--red);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:0 0 auto}
.seg button{font:500 13px var(--body);padding:6px 10px;background:var(--paper);color:var(--muted);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.go:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.viewsel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:1 1 100%;min-width:0}
.viewsel select{font:500 14px var(--body);padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-width:0;flex:1;max-width:100%}
.viewsel select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:18px 0 6px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;border:1.5px solid;flex:0 0 auto}
.sw.asm{border-color:var(--line);background:var(--paper)}
.sw.ess{border-color:var(--blue);background:var(--blue-soft)}
.sw.opt{border-color:var(--opt);background:var(--opt-soft);border-style:dashed}
.sw.ser{border:0}
.sw.dot{border:none;width:8px;height:8px;border-radius:50%;background:var(--red)}
section.phase{margin-top:34px}
.ph-head{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.ph-num{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--red)}
.ph-head h2{font-family:var(--display);font-weight:800;font-size:1.65rem;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
.yrs{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.ph-note{color:var(--muted);margin:6px 0 12px;max-width:65ch}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.t{font:500 13px/1 var(--mono);font-variant-numeric:tabular-nums;min-width:44px;height:38px;padding:0 9px;border-radius:5px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;position:relative}
.t.ess{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-family:var(--body);font-weight:600;font-size:12.5px}
.t.opt{border-color:var(--opt);border-style:dashed;background:var(--opt-soft);color:var(--muted);font-family:var(--body);font-weight:500;font-size:12.5px}
.t.s-spec{background:var(--spec-soft);color:var(--spec);border-color:var(--spec-soft)}
.t.s-mtu{background:var(--mtu-soft);color:var(--mtu);border-color:var(--mtu-soft)}
.t.s-web{background:var(--web-soft);color:var(--web);border-color:var(--web-soft)}
.t.s-sm{background:var(--sm-soft);color:var(--sm);border-color:var(--sm-soft)}

.t.opt:not(.s-asm){border-style:dashed;border-color:var(--opt)}

.t.key::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.t[aria-pressed="true"]{background:var(--done);color:var(--done-fg);border-color:var(--done);border-style:solid}
.t.is-next{outline:2px solid var(--red);outline-offset:2px}
.t:focus-visible,.row:focus-within{outline:2px solid var(--red);outline-offset:2px}
.keys{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:13.5px}
.keys li{display:flex;gap:8px}

.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.row.ess,.grp.ess{border-left:4px solid var(--blue)}
.row.opt{border-left:4px dashed var(--opt)}
.row input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--red);cursor:pointer}
.lbl{font-weight:600;min-width:0}
.tag{font:600 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:3px;margin-left:6px;vertical-align:2px}
.ess .tag{background:var(--blue-soft);color:var(--blue)}
.opt .tag{background:var(--opt-soft);color:var(--muted)}
.sub{display:block;color:var(--muted);font-size:13.5px;font-weight:400;margin-top:2px}
.row.checked .lbl{text-decoration:line-through;text-decoration-color:var(--red);opacity:.6}
.row.is-next{box-shadow:0 0 0 2px var(--red)}
.grp{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px}
.grp .tiles{gap:5px}
.tips{margin-top:44px;border-top:2px solid var(--ink);padding-top:14px}
.tips h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.4rem;margin:0 0 8px}
.tips ul{padding-left:18px;margin:0;display:grid;gap:6px;max-width:68ch}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.tools button{font:500 13px var(--body);padding:8px 12px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.tools button:focus-visible{outline:2px solid var(--red)}
.confirm{font-size:13px;color:var(--muted);flex-basis:100%}
.impbox{display:grid;gap:8px;margin-top:12px;max-width:560px;font-size:13.5px;color:var(--muted)}
.impbox textarea{font:12.5px var(--mono);padding:8px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical;min-width:0}
.impbox button{justify-self:start;font:600 13px var(--body);padding:8px 14px;border-radius:5px;border:0;background:var(--red);color:#fff;cursor:pointer}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

/* ---------- stato ---------- */
const KEY='spidey-read-v1',MODE_KEY='spidey-mode-v1';
const PRE=[];
PHASES.filter(p=>p.pre).forEach(p=>p.items.forEach(it=>{if((it.s||'asm')==='asm'&&it.kind!=='opt')PRE.push(it.id)}));
let read={};
try{read=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){read={}}
PRE.forEach(id=>{if(read[id]===undefined)read[id]=true});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(read))}catch(e){}};
save();
const VIEW_KEY='spidey-view-v1';
let view='all';
try{view=localStorage.getItem(VIEW_KEY)||(localStorage.getItem(MODE_KEY)==='solo'?'solo':'all')}catch(e){}
const hashView=()=>{const h=(location.hash||'').slice(1);return h&&(h==='all'||h==='solo'||SERIES_NAMES[h]||h==='minis'||h==='events')?h:null};
if(hashView())view=hashView();
const shown=a=>view==='all'?true:view==='solo'?!a.other:a.g===view;

function fullName(it){
  if(it.full)return tx(it.full);
  const m=PRE_RX.exec(it.n);
  if(m){const p=PREFIX[m[1]],r=m[2];
    if(r.startsWith('Ann.'))return p+' Annual '+(/^\d/.test(r.slice(5))?'#':'')+r.slice(5);
    return /^[#']/.test(r)||!/^-?\d/.test(r)?p+' '+r:p+' #'+r}
  if((it.s||'asm')==='asm'&&(it.n.startsWith('#')||it.n.startsWith('Annual')))return 'Amazing Spider-Man '+it.n;
  return it.n;
}

let all=[];
function tile(it,phase){
  const b=document.createElement('button');b.type='button';
  const s=it.s||'asm';
  b.className='t s-'+s+(it.kind?' '+it.kind:'')+(it.key?' key':'');
  const m=PRE_RX.exec(it.n);
  if(m){const sm=document.createElement('small');sm.textContent=m[1];b.append(sm,' '+m[2])}else b.textContent=it.n;
  const full=fullName(it);
  b.title=it.tip?full+' · '+tx(it.tip):full;
  b.setAttribute('aria-label',b.title);
  b.addEventListener('click',()=>{read[it.id]=!read[it.id];save();refresh()});
  const other=s!=='asm'&&it.kind!=='ess'&&!KEEP_SOLO.has(it.id);
  all.push({id:it.id,el:b,label:full,tile:true,other,g:groupOf(it),sec:phase._sec});
  return b;
}
function tag(kind){return kind==='ess'?`<span class="tag">${u('tagEss')}</span>`:kind==='opt'?`<span class="tag">${u('tagOpt')}</span>`:''}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
  document.documentElement.lang=lang;
  document.title=u('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=u(el.dataset.i18n)});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',u(el.dataset.i18nAria)));
  const ls=document.getElementById('langsw');ls.textContent='';
  Object.entries(LANGS).forEach(([code,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.lang=code;
    b.setAttribute('aria-pressed',String(code===lang));b.addEventListener('click',()=>{lang=code;try{localStorage.setItem(LANG_KEY,code)}catch(e){}render()});ls.appendChild(b)});
  const tl=document.getElementById('tipsList');tl.textContent='';
  u('tips').forEach(s=>{const li=document.createElement('li');li.textContent=s;tl.appendChild(li)});
  all=[];
  const host=document.getElementById('phases');host.textContent='';
  PHASES.forEach(p=>{
    const s=document.createElement('section');s.className='phase';p._sec=s;
    s.innerHTML=`<div class="ph-head"><span class="ph-num">${p.num}</span><h2>${esc(tx(p.title))}</h2><span class="yrs">${esc(p.yrs.replace(' oggi',lang==='it'?' oggi':' today'))}</span></div>`+(p.note?`<p class="ph-note">${esc(tx(p.note))}</p>`:'');
    if(p.mode==='tiles'){
      const box=document.createElement('div');box.className='tiles';
      p.items.forEach(it=>box.appendChild(tile(it,p)));
      s.appendChild(box);
    }else{
      const box=document.createElement('div');box.className='rows';
      p.items.forEach(it=>{
        if(it.grp){
          const g=document.createElement('div');g.className='grp'+(it.kind?' '+it.kind:'');
          g.innerHTML=`<span class="lbl">${esc(tx(it.lbl))}${tag(it.kind)}${it.sub?`<span class="sub">${esc(tx(it.sub))}</span>`:''}</span>`;
          const tb=document.createElement('div');tb.className='tiles';
          EVENTS[it.tiles].forEach(e=>tb.appendChild(tile(e,p)));
          g.appendChild(tb);box.appendChild(g);return;
        }
        const l=document.createElement('label');l.className='row'+(it.kind?' '+it.kind:'');
        l.innerHTML=`<input type="checkbox" id="c-${it.id}"><span class="lbl">${esc(tx(it.lbl))}${tag(it.kind)}${it.sub?`<span class="sub">${esc(tx(it.sub))}</span>`:''}</span>`;
        const cb=l.querySelector('input');
        cb.addEventListener('change',()=>{read[it.id]=cb.checked;save();refresh()});
        box.appendChild(l);all.push({id:it.id,el:l,cb,label:tx(it.lbl),g:'asm',sec:s});
      });
      s.appendChild(box);
    }
    if(p.keys){const ul=document.createElement('ul');ul.className='keys';p._keys=ul;
      p.keys.forEach(([a,b])=>{const li=document.createElement('li');li.innerHTML=`<b>${esc(a)}</b><span>${esc(tx(b))}</span>`;ul.appendChild(li)});
      s.appendChild(ul)}
    host.appendChild(s);
  });
  buildViews();
  refresh();
}
function buildViews(){
  const sel=document.getElementById('view');sel.textContent='';
  const count=fn=>all.filter(fn).length;
  const opt=(val,label,n)=>{const o=document.createElement('option');o.value=val;o.textContent=`${label} (${n})`;return o};
  const og=label=>{const g=document.createElement('optgroup');g.label=label;sel.appendChild(g);return g};
  const g1=og(u('grpGeneral'));
  g1.append(opt('all',u('vAll'),all.length),opt('solo',u('vSolo'),count(a=>!a.other)));
  const order=[];all.forEach(a=>{if(SERIES_NAMES[a.g]&&!order.includes(a.g))order.push(a.g)});
  order.sort((x,y)=>x==='asm'?-1:y==='asm'?1:0);
  const g2=og(u('grpSeries'));
  order.forEach(k=>g2.appendChild(opt(k,SERIES_NAMES[k],count(a=>a.g===k))));
  const g3=og(u('grpOther'));
  g3.append(opt('minis',u('gMinis'),count(a=>a.g==='minis')),opt('events',u('gEvents'),count(a=>a.g==='events')));
  if(![...sel.options].some(o=>o.value===view))view='all';
  sel.value=view;
}

function refresh(){
  let done=0,last=-1;
  const vis=all.filter(shown);
  const secVis=new Map();
  all.forEach(a=>{const v=shown(a);a.el.hidden=!v;if(v)secVis.set(a.sec,true);a.el.classList.remove('is-next');
    const r=!!read[a.id];
    if(a.tile)a.el.setAttribute('aria-pressed',r?'true':'false');
    else{a.cb.checked=r;a.el.classList.toggle('checked',r)}});
  vis.forEach((a,i)=>{if(read[a.id]){done++;last=i}});
  PHASES.forEach(p=>{if(p._sec)p._sec.hidden=!secVis.get(p._sec);if(p._keys)p._keys.hidden=!(view==='all'||view==='solo')});
  const sel=document.getElementById('view');if(sel.value!==view)sel.value=view;
  // Il prossimo è il primo non letto dopo l'ultimo letto; se dopo non c'è nulla, il primo rimasto indietro
  const next=vis.slice(last+1).find(a=>!read[a.id])||vis.find(a=>!read[a.id])||null;
  if(next)next.el.classList.add('is-next');
  document.getElementById('count').textContent=done+' / '+vis.length;
  document.getElementById('fill').style.width=(vis.length?done/vis.length*100:0)+'%';
  const nx=document.getElementById('next');nx.textContent='';
  if(next){nx.append(u('next'));const b=document.createElement('button');b.type='button';b.className='go';b.textContent=next.label;
    b.title=u('jump');b.addEventListener('click',()=>next.el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));nx.append(b)}
  else nx.textContent=u('done');
}

function setView(v){view=v;try{localStorage.setItem(VIEW_KEY,v)}catch(e){}
  try{history.replaceState(null,'','#'+v)}catch(e){}
  refresh();window.scrollTo({top:0});}
document.getElementById('view').addEventListener('change',e=>setView(e.target.value));
window.addEventListener('hashchange',()=>{const h=hashView();if(h&&h!==view)setView(h)});
const rb=document.getElementById('reset'),cf=document.getElementById('confirm');let armed=false;
const say=s=>{cf.hidden=false;cf.textContent=s};
rb.addEventListener('click',()=>{
  if(!armed){armed=true;rb.textContent=u('resetConfirm');say(u('resetAsk'));return}
  // Salva ogni voce come non letta, così alla riapertura la fase 0 non torna spuntata
  read={};all.forEach(a=>{read[a.id]=false});save();refresh();armed=false;rb.textContent=u('reset');say(u('resetDone'));
});
const code=()=>'SPIDEY1:'+all.filter(a=>read[a.id]).map(a=>a.id).join(',');
document.getElementById('copy').addEventListener('click',()=>{
  const c=code();
  const fallback=()=>{const box=document.getElementById('impbox'),ta=document.getElementById('imptext');box.hidden=false;ta.value=c;ta.select();say(u('copyManual'))};
  try{navigator.clipboard.writeText(c).then(()=>say(u('copied')),fallback)}catch(e){fallback()}
});
document.getElementById('imp').addEventListener('click',()=>{const box=document.getElementById('impbox');box.hidden=!box.hidden;if(!box.hidden){document.getElementById('imptext').value='';document.getElementById('imptext').focus()}});
document.getElementById('impgo').addEventListener('click',()=>{
  const v=document.getElementById('imptext').value.trim();
  if(!v.startsWith('SPIDEY1:')){say(u('impBad'));return}
  const ids=new Set(v.slice(8).split(',').filter(Boolean));
  read={};all.forEach(a=>{read[a.id]=ids.has(a.id)});save();refresh();
  document.getElementById('impbox').hidden=true;say(u('impOk').replace('{n}',ids.size));
});
render();
</script>
